name: Build PES 2013 iOS Port

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Prepare Project Structure
      run: |
        echo "Preparing PES 2013 iOS project structure..."
        mkdir -p build/payload
        cp -R ios-scaffold/ build/payload/

    - name: Package IPA for SideStore / LiveContainer
      run: |
        cd build
        mkdir Payload
        mv payload Payload/PES2013.app
        zip -r PES2013-ios-port.ipa Payload
        echo "IPA package created successfully!"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PES2013-ios-port-ipa
        path: build/PES2013-ios-port.ipa
